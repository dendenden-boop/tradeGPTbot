name: Native certification verification
on:
  push:
    branches: [codex/phase12-certification-green-2]
permissions:
  contents: read
concurrency:
  group: native-certification-green-2
  cancel-in-progress: true
jobs:
  reproduce:
    name: Native PostgreSQL GREEN verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm build
      - run: pnpm test:integration
      - name: Upload actual native reproduction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-certification-green-2
          path: test-results/
          if-no-files-found: error
          retention-days: 7
