packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
strictPeerDependencies: true
minimumReleaseAge: 1440
storeDir: .pnpm-store
engineStrict: true
saveExact: true
overrides:
  '@prisma/config@7.10.0>deepmerge-ts': 8.0.0
  'prisma@7.10.0>mysql2': 3.23.1
  'ajv@8.20.0>fast-uri': 3.1.8
  '@fastify/ajv-compiler@4.0.6>fast-uri': 4.1.5
  'fast-json-stringify@7.0.1>fast-uri': 4.1.5
  'minimatch@10.2.6>brace-expansion': 5.0.12
  'postcss@8.5.28>source-map-js': 1.2.2
allowBuilds:
  argon2@0.45.1: true
  esbuild@0.28.2: true
  prisma@7.10.0: true
  '@prisma/engines@7.10.0': true
